# yaml-language-server: $schema=./Configuration/Schema/ImpExpNL.schema.json
# packages/imp_exp_nl/imp_exp_nl.yaml
#
# Hauptkonfiguration für ImpExpNL.
# (Die obige Modeline aktiviert Autocomplete/Validierung in IDEs mit YAML-Language-Server.)
# Weitere Extensions können eigene Tabellen registrieren unter:
#   Configuration/ImpExpNL.yaml (im jeweiligen Extension-Ordner)

# Stabiler Bezeichner des Quellsystems. Wird beim Export ins Manifest (_meta)
# geschrieben und beim Import zur Auflösung des Herkunfts-Mappings
# (tx_impexpnl_uid_map) genutzt. Leer = Einzelquelle. Nur setzen, wenn aus
# mehreren Quellsystemen in dieselbe Instanz importiert wird – dann je Quelle
# einen eindeutigen Wert vergeben (z.B. "redaktion-a").
source_id: ''

export:
  include:
    file_references: true     # FAL-Referenzen mit Datei-Identifier exportieren

import:
  include:
    file_references: true     # FAL-Referenzen über Dateipfad auflösen
  container_support: true     # b13/container: tx_container_parent remappen
  # Signaturpflicht: Nur Importdateien mit gültiger HMAC-Signatur (hmac-sha256:)
  # akzeptieren. Dateien ohne Prüfsumme oder mit bloßer sha256-Prüfsumme werden
  # abgewiesen (Exit-Code 4). Setzt einen konfigurierten Signing-Key voraus
  # (IMPEXPNL_SIGNING_KEY). Empfohlen: true bei Importen über ein Sicherheitsgefälle.
  require_signature: false
  batch_size: 500             # Records pro DataHandler-Batch
  lock_stale_seconds: 3600    # nach dieser Zeit gilt ein hängender Lock als veraltet
  auto_rollback_on_failure: true  # abgebrochenen Teilimport automatisch zurückrollen
  fal:
    storage_id: 1             # Default-Storage, falls eine Referenz keine eigene Angabe trägt
  link_rewrite:
    # Felder, in denen t3://page-Links auf die Ziel-UIDs umgeschrieben werden.
    # Hier eigene/Extension-spezifische Felder ergänzen, z.B. bei GSB 11:
    #   - tx_gsb_accordion_text
    fields:
      - bodytext
      - pi_flexform

# ============================================================================
# Table-Registry: Deklarativer Export/Import beliebiger Tabellen.
#
# type: mm      → MM-Tabellen (z.B. sys_category_record_mm)
#                  match_field: Welches Feld die Foreign-UID enthält
#                  match_tablenames_field: Feld das den Tabellennamen enthält
#                  match_tables: Welche Tabellen relevant sind
#
# type: record  → Normale Record-Tabellen (z.B. sys_redirect, tx_news_*)
#                  pid_field: Welches Feld die Seiten-Zuordnung enthält
#                  uid_remap: true → UIDs werden gemapped (für Rollback)
#                  rewrite_links: Felder in denen t3://page-Links umgeschrieben werden
# ============================================================================

impexpnl:
  tables:

    # --- Systemkategorien (MM-Tabelle mit Pfad-Matching) ---
    # category_match: path → Kategorien werden über ihren Pfad gemapped
    # (z.B. "Themen > Digitalisierung") statt über uid_local.
    # Fehlende Kategorien werden auf dem Zielsystem automatisch angelegt.
    sys_category_record_mm:
      type: mm
      match_field: uid_foreign
      match_tablenames_field: tablenames
      match_tables:
        - pages
        - tt_content
        - tx_news_domain_model_news
        - tt_address
      category_match: path

    # --- Redirects (Record-Tabelle) ---
    # Exportiert alle sys_redirect-Einträge, deren pid im exportierten Baum liegt.
    # Links im 'target'-Feld (z.B. t3://page?uid=123) werden automatisch umgeschrieben.
    sys_redirect:
      type: record
      pid_field: pid
      uid_remap: true
      rewrite_links:
        - target

    # --- News (EXT:georgringer/news) — Ziel-Extension-Profil ---
    # Wird still übersprungen, wenn EXT:news nicht installiert ist (Tabelle fehlt).
    # Kategorien laufen über sys_category_record_mm (oben, match_tables enthält news).
    tx_news_domain_model_news:
      type: record
      pid_field: pid
      uid_remap: true
      rewrite_links:
        - bodytext

    # --- Adressen (EXT:friendsoftypo3/tt-address) — zweites Ziel-Extension-Profil ---
    # Belegt, dass Record-Profil + Kategorie-MM generisch (nicht news-spezifisch) sind.
    tt_address:
      type: record
      pid_field: pid
      uid_remap: true

# ============================================================================
# Transfer- & Transport-Profile (optional)
#
# assetTransports = das "Wie" (Verpackung), transferProfiles = das "Was"/Policy.
# Auswahl beim Import:  impexpnl:import <file> <pid> --transfer-profile=<name>
# Beim Export wählt der Transport-Typ die Verpackung: --transport=external|bundle
# ============================================================================

assetTransports:
  external_default:
    type: external            # nur Manifest + Asset-Liste; Transfer via rsync/rclone/S3
  bundle_full:
    type: bundle              # self-contained .tar.gz inkl. der Asset-Dateien
    includeAssets: true

transferProfiles:
  # Inhalte von Produktion nach Dev holen: Überschreiben ok, nur auf Dev/Test erlaubt.
  prod_to_dev:
    transport: external_default
    conflictStrategy: overwrite
    allowedContext:
      - Development
      - Testing
  # Freigabe-Paket für Produktion: bei Konflikt abbrechen, nur auf Production erlaubt.
  # allowedTables begrenzt den Wirkbereich des Registry-Imports (Wirkbereichs-
  # Allowlist): nicht gesetzt = alle registrierten Tabellen, gesetzt = nur die
  # genannten (leere Liste = keine Registry-Tabellen, nur pages/tt_content/FAL).
  stage_to_prod_release:
    transport: bundle_full
    conflictStrategy: abort
    allowedContext:
      - Production
    allowedTables:
      - sys_redirect
      - sys_category_record_mm

# ============================================================================
# Optionale Content-Transformationen (Default aus) – Vorlagen zum Einkommentieren.
#
# rewrite_urls (Import): absolute Domain-URLs feldbezogen ersetzen (getrennt vom
# t3://page-Link-Rewriter). sanitize (Export): PII vor dem Schreiben anonymisieren.
# ============================================================================
#
# import:
#   rewrite_urls:
#     enabled: true
#     fields: [bodytext, header_link]
#     rules:
#       - { search: 'https://www.prod.example.com', replace: 'https://dev.example.com' }
#       - { search: '#https?://(stage|prod)\.example\.com#', replace: 'https://dev.example.com', regex: true }
#
# export:
#   sanitize:
#     enabled: true
#     hash_key: 'geheimes-salt'   # Schlüssel für strategy: hash (HMAC-SHA256);
#                                 # alternativ Env IMPEXPNL_SANITIZE_KEY. Ohne Schlüssel
#                                 # nur ungesalzenes SHA256 (wörterbuch-angreifbar, Warnung im Log).
#     rules:
#       fe_users:
#         - { field: email,    strategy: hash }
#         - { field: username, strategy: hash }
#         - { field: password, strategy: clear }
#         - { field: first_name, strategy: fixed, value: 'Anonym' }
